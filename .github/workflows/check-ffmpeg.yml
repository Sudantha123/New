name: Test Fast FFmpeg Setup

on:
  workflow_dispatch:

jobs:
  test-setup-ffmpeg-action:
    name: Method 1 - setup-ffmpeg action
    runs-on: ubuntu-latest
    steps:
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify FFmpeg & Codecs
        run: |
          which ffmpeg
          ffmpeg -version | head -n 2
          echo "=== Encoders ==="
          ffmpeg -hide_banner -encoders | grep -E "libx264|libx265|aac"

  test-static-binary:
    name: Method 2 - Static Binary Download
    runs-on: ubuntu-latest
    steps:
      - name: Download & Extract Static FFmpeg
        run: |
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C /tmp
          sudo mv /tmp/ffmpeg /tmp/ffprobe /usr/local/bin/

      - name: Verify FFmpeg & Codecs
        run: |
          which ffmpeg
          ffmpeg -version | head -n 2
          echo "=== Encoders ==="
          ffmpeg -hide_banner -encoders | grep -E "libx264|libx265|aac"
